project:
  name: "SPECTRA"
  version: "0.1"

paths:
  input_videos: "data/videos"
  output_videos: "outputs"
  models:
    player: "data/models/football-player-detection.pt"
    ball: "data/models/football-ball-detection.pt"
    pitch: "data/models/football-pitch-detection.pt"
    sam: "mobile_sam.pt"

inference:
  device: "cuda"   # você tem GPU
  stride: 10

detection:
  confidence_threshold: 0.3
  nms_threshold: 0.7

tracking:
  bytetrack:
    min_frames: 3

analysis:
  pass:
    proximity_limit: 40
    min_frames: 2
    display_frames: 60
  shot:
    speed_threshold: 30.0
    proximity_limit: 140.0
    min_speed_ratio: 2.0
    confirmation_frames: 3
    min_progress_px: 45.0
    direction_consistency: 0.8
    min_horizontal_ratio: 1.15

team_classification:
  kmeans_frames: 150

output:
  save_video: true
